        mirror ? -fields.joint5Position.value : fields.joint5Position.value,
        fields.joint6Position.value,
        fields.joint7Position.value];
      function aaToM(a) {
        const n = Math.hypot(a[0], a[1], a[2]) || 1, x = a[0]/n, y = a[1]/n, z = a[2]/n;
        const c = Math.cos(a[3]), s = Math.sin(a[3]), C = 1 - c;
        return [[c + x*x*C, x*y*C - z*s, x*z*C + y*s],
                [y*x*C + z*s, c + y*y*C, y*z*C - x*s],
                [z*x*C - y*s, z*y*C + x*s, c + z*z*C]];
      }
      function mul(A, B) {
        return A.map(r => [0, 1, 2].map(j => r[0]*B[0][j] + r[1]*B[1][j] + r[2]*B[2][j]));
      }
      function mToAa(M) {
        const t = Math.acos(Math.max(-1, Math.min(1, (M[0][0] + M[1][1] + M[2][2] - 1) / 2)));
        if (t < 1e-9) return [0, 0, 1, 0];
        if (Math.PI - t < 1e-6) {
          const x = Math.sqrt(Math.max(0, (M[0][0] + 1) / 2)), y = Math.sqrt(Math.max(0, (M[1][1] + 1) / 2)), z = Math.sqrt(Math.max(0, (M[2][2] + 1) / 2));
          const sy = M[0][1] + M[1][0] < 0 ? -1 : 1, sz = M[0][2] + M[2][0] < 0 ? -1 : 1;
          return x > 1e-6 ? [x, sy*y, sz*z, t] : [0, y, (M[1][2] + M[2][1] < 0 ? -1 : 1)*z, t];
        }
        const s = 2*Math.sin(t);
        return [(M[2][1] - M[1][2])/s, (M[0][2] - M[2][0])/s, (M[1][0] - M[0][1])/s, t];
      }
      function endPoint(anchor, axis, angle, t0, r0) {
        const R = aaToM([axis[0], axis[1], axis[2], angle]);
        const d = [t0[0] - anchor[0], t0[1] - anchor[1], t0[2] - anchor[2]];
        const t = [0, 1, 2].map(i => anchor[i] + R[i][0]*d[0] + R[i][1]*d[1] + R[i][2]*d[2]);
        const a = mToAa(mul(R, aaToM(r0)));
        return 'translation ' + t.join(' ') + '\n rotation ' + a.join(' ');
      }
