      // Pose each endPoint at its initial joint angle. Webots takes an endPoint transform as given,
      // so writing only jointParameters.position would just shift the encoder zero.
      const mirror = fields.mirrorInitialPoseFromPrefix.value && fields.prefix.value === "Left_";
      const q = [null,
        mirror ? -fields.joint1Position.value : fields.joint1Position.value,
        fields.joint2Position.value,
